"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'catppuccin_mocha'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs$bun$deno$python$ruby$rust$golang$elixir$erlang$java$lua$zig$php\
$docker_context\
${env_var.AWS_PROFILE}\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)[@](overlay1)"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[$hostname]($style) "

[directory]
style = "bold blue"
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style)) '
conflicted = "= "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version) ]($style)"

[bun]
symbol = "🥟 "
style = "peach"
format = "[$symbol($version) ]($style)"

[deno]
symbol = " "
style = "green"
format = "[$symbol($version) ]($style)"

[python]
symbol = " "
style = "yellow"
format = '[$symbol($version)( \($virtualenv\)) ]($style)'

[ruby]
symbol = " "
style = "red"
format = "[$symbol($version) ]($style)"

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version) ]($style)"

[golang]
symbol = " "
style = "sky"
format = "[$symbol($version) ]($style)"

[elixir]
symbol = " "
style = "mauve"
format = "[$symbol($version) ]($style)"

[erlang]
symbol = " "
style = "red"
format = "[$symbol($version) ]($style)"

[java]
symbol = " "
style = "peach"
format = "[$symbol($version) ]($style)"

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version) ]($style)"

[zig]
symbol = " "
style = "yellow"
format = "[$symbol($version) ]($style)"

[php]
symbol = " "
style = "blue"
format = "[$symbol($version) ]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

# Only show AWS context when a profile is explicitly exported (not just
# because ~/.aws/config has a default region) — keeps the prompt quiet.
[env_var.AWS_PROFILE]
variable = "AWS_PROFILE"
symbol = " "
style = "peach"
format = "[$symbol$env_value]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[󰔟 $duration]($style) "

[time]
disabled = false
style = "overlay1"
format = "[$time]($style)"
time_format = "%H:%M"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
overlay1 = "#7f849c"
surface2 = "#585b70"
base = "#1e1e2e"
crust = "#11111b"
